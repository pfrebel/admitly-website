    <rect x="110" y="290" width="12" height="80"/>
    <rect x="150" y="290" width="12" height="80"/>
    <rect x="190" y="290" width="12" height="80"/>
    <rect x="230" y="290" width="12" height="80"/>
    <rect x="358" y="290" width="12" height="80"/>
    <rect x="398" y="290" width="12" height="80"/>
    <rect x="438" y="290" width="12" height="80"/>
    <rect x="478" y="290" width="12" height="80"/>
  </g>
  <!-- windows center -->
  <g fill="#6c5ce7" opacity="0.5">
    <rect x="270" y="215" width="14" height="30" rx="3"/>
    <rect x="293" y="215" width="14" height="30" rx="3"/>
    <rect x="316" y="215" width="14" height="30" rx="3"/>
  </g>
  <text x="300" y="430" text-anchor="middle" fill="#c9c4f5" font-family="Georgia, serif" font-size="22" letter-spacing="2">ETH ZURICH</text>
</svg>
