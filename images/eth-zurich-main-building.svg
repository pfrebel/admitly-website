  </defs>
  <rect width="600" height="450" fill="url(#skyEth)"/>
  <rect x="0" y="400" width="600" height="50" fill="#1a1730"/>
  <!-- domed main building -->
  <rect x="90" y="270" width="420" height="130" fill="#3d3670"/>
  <rect x="80" y="260" width="440" height="16" fill="#241f45"/>
