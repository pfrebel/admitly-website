    <rect x="198" y="264" width="18" height="82" rx="9"/>
    <rect x="243" y="264" width="18" height="82" rx="9"/>
    <rect x="288" y="264" width="18" height="82" rx="9"/>
    <rect x="333" y="264" width="18" height="82" rx="9"/>
    <rect x="378" y="264" width="18" height="82" rx="9"/>
    <rect x="423" y="264" width="18" height="82" rx="9"/>
  </g>
  <text x="300" y="430" text-anchor="middle" fill="#c9c4f5" font-family="Georgia, serif" font-size="22" letter-spacing="2">CAMBRIDGE</text>
