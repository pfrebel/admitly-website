  <polygon points="106,170 123,150 140,170" fill="#5a4fc2"/>
  <polygon points="460,170 477,150 494,170" fill="#5a4fc2"/>
  <!-- windows -->
  <g fill="#241f45">
    <rect x="150" y="260" width="24" height="90" rx="12"/>
    <rect x="195" y="260" width="24" height="90" rx="12"/>
    <rect x="240" y="260" width="24" height="90" rx="12"/>
    <rect x="285" y="260" width="24" height="90" rx="12"/>
    <rect x="330" y="260" width="24" height="90" rx="12"/>
    <rect x="375" y="260" width="24" height="90" rx="12"/>
